# devices/pgp110/device.conf: what this device repository is. tools/hakios-device.py reads it;
# the device's page is made from it, so the status is said in one place.

# Cape / SM8475 (soc_id 530), Adreno 730. OnePlus Ace Pro (PGP110, China) and
# OnePlus 10T (AQ101, global) are the same Cape hardware. Facts in this repo
# were captured from a PGP110 unit; the AQ101 variant must be re-verified.

device pgp110
	title       OnePlus Ace Pro / OnePlus 10T (Cape MTP, Ovaltine)
	vendor      OnePlus
	soc         sm8475
	defconfig   pgp110_defconfig
	firmware    pull-firmware.sh
	maintainer  port-in-progress
	status      display     works     panel lit at 1080x2412; desktop renders and scrolls with touch
	status      touch       works     Synaptics S3910 on SE4 (gpio16-19, INT 21, RESET 20, 1.8 V enable 97) wired up; touch events and scrolling usable
	status      buttons     works     keys detected and usable on device
	status      cpu         works     all 8 cores online
	status      gpu         partial   Adreno 730 (gen7-4-0): 18-step power-up sequence passed on one boot (GMU firmware loaded, zap shader authenticated, 3D core writes memory, HakiosGPU service up); Mesa rendering / UI acceleration not confirmed
	status      storage     partial   root filesystem mounts over UFS on the way to the desktop; ufshc@1d84000 register map still unchecked against this device tree
	status      audio       missing   the ADSP firmware and the codec are the reference phone's
	status      battery     missing   the gauge goes through the ADSP, which is not ported
	status      haptic      missing   the motor and its rail are unknown here
	status      camera      missing   not attempted
	status      wifi        partial   QCA6490 on PCIe0/MHI identified with full address/pin/rail facts; PCIe/MHI driver not written, DMA/MSI untested
	status      bluetooth   missing   not started
	status      cellular    missing   modem firmware not pulled; the IPA layout differs from the reference
	status      thermal     missing   gpuss-0/gpuss-1 zones are there, no driver reads them yet
